<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ñandu</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="titlebar"><span class="logo">Ñ</span><span id="title">Ñandu</span></header>

  <nav id="menubar">
    <div class="menu" data-menu="file">File
      <div class="dropdown">
        <button data-action="open">Open...</button>
        <button data-action="reload">Reload network</button>
      </div>
    </div>
    <div class="menu" data-menu="view">View
      <div class="dropdown">
        <button data-action="zoom-extents">Zoom extents</button>
        <button data-action="toggle-explorer">Explorer bar</button>
        <button data-action="toggle-properties">Properties</button>
        <button data-action="toggle-results">Simulation results</button>
      </div>
    </div>
    <div class="menu" data-menu="analysis">Analysis
      <div class="dropdown">
        <button data-action="dialog-loadflow">Load Flow...</button>
        <button data-action="dialog-allocate">Load Allocation...</button>
        <button data-action="dialog-estimate">Distribution State Estimator...</button>
      </div>
    </div>
    <div class="menu" data-menu="reports">Reports
      <div class="dropdown">
        <button data-report="summary">Load Flow - Summary Report</button>
        <button data-report="buses">Load Flow - Buses</button>
        <button data-report="lines">Load Flow - Lines and Cables</button>
        <button data-report="abnormal">Load Flow - Abnormal conditions</button>
        <button data-report="iterations">Iteration Report</button>
        <button data-report="meters">Distribution State Estimator - Meter</button>
        <button data-report="loads">Load Values (Load Allocation / DSE)</button>
      </div>
    </div>
    <div class="menu" data-menu="help">Help
      <div class="dropdown">
        <button data-action="about">About Ñandu</button>
      </div>
    </div>
  </nav>

  <div id="toolbar">
    <button class="tb" data-action="open" title="Open"><svg viewBox="0 0 16 16"><path d="M1 4h5l1 1h7v8H1z" fill="#f2c94c" stroke="#b8860b"/></svg></button>
    <span class="sep"></span>
    <button class="tb" data-action="zoom-extents" title="Zoom extents"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" fill="none" stroke="#2d5aa0"/><path d="M5 8h6M8 5v6" stroke="#2d5aa0"/></svg></button>
    <button class="tb" data-action="zoom-in" title="Zoom in"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="#e8f1fb" stroke="#2d5aa0"/><path d="M10.5 10.5l4 4M5 7h4M7 5v4" stroke="#2d5aa0" stroke-width="1.4"/></svg></button>
    <button class="tb" data-action="zoom-out" title="Zoom out"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="#e8f1fb" stroke="#2d5aa0"/><path d="M10.5 10.5l4 4M5 7h4" stroke="#2d5aa0" stroke-width="1.4"/></svg></button>
    <span class="sep"></span>
    <button class="tb run" data-action="dialog-loadflow" title="Load Flow"><svg viewBox="0 0 16 16"><path d="M9 1L3 9h4l-1 6 6-8H8z" fill="#f2b705" stroke="#8a6d00" stroke-width=".7"/></svg><span>Load Flow</span></button>
    <button class="tb run" data-action="dialog-allocate" title="Load Allocation"><svg viewBox="0 0 16 16"><path d="M8 2v4M8 6l-5 4M8 6l5 4M8 6v4" stroke="#2d5aa0" fill="none" stroke-width="1.3"/><circle cx="8" cy="2.5" r="1.8" fill="#2d5aa0"/><path d="M1.5 11h3l-1.5 3zM6.5 11h3L8 14zM11.5 11h3l-1.5 3z" fill="#e07b00"/></svg><span>Load Allocation</span></button>
    <button class="tb run" data-action="dialog-estimate" title="Distribution State Estimator"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="#e3f3e3" stroke="#2f7d32"/><path d="M4 9l3 2 5-6" fill="none" stroke="#2f7d32" stroke-width="1.6"/></svg><span>DSE</span></button>
    <span class="sep"></span>
    <button class="tb" data-report="summary" title="Show reports"><svg viewBox="0 0 16 16"><rect x="3" y="1.5" width="10" height="13" fill="#fff" stroke="#555"/><path d="M5 5h6M5 8h6M5 11h4" stroke="#2d5aa0"/></svg></button>
    <span class="sep"></span>
    <label class="tbl">Color Coding Layer
      <select id="colorLayer">
        <option value="network">Network color</option>
        <option value="phase">Phase</option>
        <option value="voltage">Voltage level (%)</option>
        <option value="loading">Loading level color(%)</option>
      </select>
    </label>
    <label class="tbl">Tag Layer
      <select id="tagLayer">
        <option value="none">None</option>
        <option value="voltage">Voltage (V)</option>
        <option value="current">Current (A)</option>
        <option value="id">Equipment number</option>
      </select>
    </label>
    <label class="tbl"><input type="checkbox" id="showDevices" checked> Symbols</label>
  </div>

  <main id="workspace">
    <aside id="explorer" class="dock left">
      <div class="dock-title">Explorer<button class="dock-close" data-action="toggle-explorer">×</button></div>
      <div class="dock-body" id="explorerBody"></div>
      <div class="dock-tabs"><span class="active">Networks</span></div>
    </aside>

    <section id="center">
      <div class="doc-tabs"><span class="active" id="viewTab">One-line diagram</span></div>
      <div id="viewWrap">
        <canvas id="view"></canvas>
        <div id="tooltip" hidden></div>
        <div id="legend" hidden></div>
        <div id="busy" hidden><div class="spinner"></div><span id="busyText">Running...</span></div>
      </div>
      <div id="results" class="dock bottom">
        <div class="dock-title">Simulation Result<button class="dock-close" data-action="toggle-results">×</button></div>
        <div class="report-tabs" id="reportTabs"></div>
        <div class="dock-body" id="reportBody"><p class="empty">Run an analysis to display results.</p></div>
      </div>
    </section>

    <aside id="properties" class="dock right">
      <div class="dock-title">Properties<button class="dock-close" data-action="toggle-properties">×</button></div>
      <div class="prop-select" id="propSelect">No selection</div>
      <div class="dock-body" id="propBody"></div>
      <div class="dock-tabs"><span class="active">Properties</span></div>
    </aside>
  </main>

  <footer id="statusbar">
    <span id="status">Ready</span>
    <span id="coords">X: —  Y: —</span>
    <span id="crs"></span>
    <span id="selCount"></span>
  </footer>
</div>

<dialog id="analysisDialog">
  <form method="dialog">
    <div class="dlg-title" id="dlgTitle">Load Flow Analysis</div>
    <div class="dlg-tabs"><span class="active">Parameters</span><span>Networks</span></div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-buttons">
      <button value="run" class="primary" id="dlgRun">Run</button>
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="openDialog">
  <form method="dialog">
    <div class="dlg-title">Open study</div>
    <div class="dlg-body"><select id="fileList" size="8"></select></div>
    <div class="dlg-buttons">
      <button value="open" class="primary">Open</button>
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
